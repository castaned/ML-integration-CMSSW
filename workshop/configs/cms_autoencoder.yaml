# Template: generate personal paths with workshop/setup_cms.py.
data:
  normal_input_paths:
  - REPLACE_H5_DYJets
  - REPLACE_H5_WZ
  - REPLACE_H5_ZZ
  anomaly_input_paths:
  - REPLACE_H5_Wprime
  output_path: REPLACE_PERSONAL_RESULTS
  features:
  - MET_pt
  - M3l
  - Z_deltaR
  - Z_mass
  - Lep_pt_sum
  - Z_pt
  - Lep1Z_pt
  - Lep2Z_pt
  - Lep3W_pt
  - W_mt
  label: Dataset_ID
  normal_labels:
  - 4
  - 5
  - 6
  anomaly_labels:
  - 1
  normal_process_names:
    4: DYJets
    5: WZ
    6: ZZ
model:
  name: cms_autoencoder
  type: autoencoder
  hidden_dims:
  - 16
  - 8
  latent_dim: 2
  epochs: 60
  batch_size: 256
  learning_rate: 0.001
  patience: 8
  export_onnx: false
anomaly_detection:
  validation_fraction: 0.2
  test_fraction: 0.2
  normal_quantile: 0.99
  seed: 16
