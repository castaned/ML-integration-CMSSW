---
plotting:
  output_dir: "./plots"

  datasets:
    - name: "signal"
      label: "Signal"
      path: ""
      tree_name: "Events"
      color: "#d62728"

    - name: "background"
      label: "Background"
      path: ""
      tree_name: "Events"
      color: "#1f77b4"

  plots:
    - branch: "nLeptons"
      title: "Lepton Multiplicity"
      xlabel: "nLeptons"
      bins: 8
      range: [0, 8]
      output: "nLeptons.png"

    - branch: "A_Zmass"
      title: "Channel A Z Mass"
      xlabel: "A_Zmass [GeV]"
      bins: 40
      range: [0, 200]
      selection: "A_pass > 0"
      output: "A_Zmass.png"

    - branch: "B_Wmass"
      title: "Channel B W Mass"
      xlabel: "B_Wmass [GeV]"
      bins: 40
      range: [0, 200]
      selection: "B_pass > 0"
      output: "B_Wmass.png"

    - branch: "Dataset_ID"
      title: "Dataset Identifier"
      xlabel: "Dataset_ID"
      bins: 10
      range: [0, 10]
      output: "dataset_id.png"
