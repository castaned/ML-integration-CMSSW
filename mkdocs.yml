site_name: ML integration in CMSSW
site_url: https://castaned.github.io/ML-integration-CMSSW/
theme:
    name: material

    palette:
      # Dark mode
      - scheme: slate
        toggle:
          icon: material/weather-sunny
          name: Light mode
        primary: amber
        accent: indigo

      # Light mode
      - scheme: default
        toggle:
          icon: material/weather-night
          name: Night mode
        primary: amber
        accent: indigo

    font:
      text: Merriweather Sans
      code: JetBrains Mono

    features:
      - navigation.indexes

markdown_extensions:
   - admonition
   - pymdownx.details
   - pymdownx.superfences
   - footnotes
   - attr_list
   - md_in_html

nav:
  - Getting started:
    - getting-started/01_overview.md
    - getting-started/02_architecture.md
  - CERN Computing Environment:
    - cern-systems/01_lxplus.md
    - cern-systems/02_storage.md
    - cern-systems/03_computing-resources.md
    - cern-systems/04_CMSSW.md
    - cern-systems/05_GRID-authentication.md
    - cern-systems/06-NanoAOD.md
    - cern-systems/07_dataset-discovery.md
    - datasets/02_dataset_search.md
  - Framework:
    - framework/01_architecture.md
#    - framework/02_data-processing.md
#    - framework/03_ml.md
    - framework/04_framework-setup.md
  - Example of usage:
    - usage/01_usage.md
  - Practical Machine Learning in HEP (Yuca / Open Data):
    - practical-ml-hep/index.md
    - Configuración del sistema: yuca-course/01_entorno.md
    - Datos abiertos y NanoAOD: yuca-course/02_datos.md
    - Clasificación Higgs, análisis y entrenamiento: practical-ml-hep/higgs.md
    - Autoencoder CMS: practical-ml-hep/autoencoder.md
    - Bitácora y ejercicios: practical-ml-hep/experiments.md
    - Problemas frecuentes: yuca-course/06_problemas.md
    - Preparación del instructor: practical-ml-hep/instructor.md
    - Referencia del procesamiento ROOT y HDF5: yuca-course/03_procesamiento.md
    - Referencia del clasificador del framework: yuca-course/04_clasificador.md
    - Referencia del autoencoder del framework: yuca-course/05_autoencoder.md
