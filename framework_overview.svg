<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ML-integration-CMSSW Framework Overview</title>
  <desc id="desc">Single-page architecture diagram showing NanoAOD input through data processing, conversion, machine learning training, and future plotting.</desc>
  <defs>
    <style>
      .bg { fill: #f6f1e8; }
      .panel { fill: #fcfaf5; stroke: #d8cfbf; stroke-width: 2; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; letter-spacing: 0.08em; }
      .box-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .accent { fill: #fff8e8; stroke: #c08a1a; stroke-width: 3; }
      .main { fill: #ffffff; stroke: #1f2937; stroke-width: 3; }
      .future { fill: #edf7f2; stroke: #2f7d57; stroke-width: 3; }
      .entry { fill: #fff2cc; stroke: #b7791f; stroke-width: 4; }
      .line { stroke: #475569; stroke-width: 4; fill: none; stroke-linecap: round; }
      .dashed { stroke-dasharray: 10 10; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <rect class="panel" x="32" y="28" rx="28" ry="28" width="1336" height="844"/>

  <text class="title" x="70" y="70">ML-integration-CMSSW</text>
  <text class="subtitle" x="70" y="105">One-page framework overview for student onboarding</text>
  <line x1="70" y1="128" x2="1330" y2="128" stroke="#d8cfbf" stroke-width="2"/>

  <rect class="accent" x="70" y="185" rx="20" ry="20" width="1260" height="78" filter="url(#shadow)"/>
  <text class="section" x="100" y="220">KEY IDEA</text>
  <text class="box-text" x="100" y="248">A change in <tspan font-weight="700">filterNanoAOD.py</tspan> can be traced through the entire pipeline:</text>
  <text class="box-text" x="690" y="248">NanoAOD -&gt; filtered ROOT -&gt; HDF5 -&gt; ML training -&gt; results</text>

  <rect class="future" x="935" y="46" rx="18" ry="18" width="355" height="82" filter="url(#shadow)"/>
  <text class="box-title" x="962" y="80">Future branch</text>
  <text class="box-text" x="962" y="107">plotting / visualization</text>

  <rect class="main" x="90" y="320" rx="22" ry="22" width="220" height="120" filter="url(#shadow)"/>
  <text class="box-title" x="125" y="360">NanoAOD ROOT</text>
  <text class="box-text" x="125" y="392">CMS datasets</text>
  <text class="box-text" x="125" y="418">input files</text>

  <rect class="entry" x="360" y="285" rx="24" ry="24" width="300" height="190" filter="url(#shadow)"/>
  <text class="box-title" x="390" y="325">data_processing/</text>
  <text class="box-text" x="390" y="360">execute_data_processing.py</text>
  <text class="box-text" x="390" y="388">run_filter.sh</text>
  <text class="box-text" x="390" y="423">example_files/main_process/</text>
  <text class="box-text" x="415" y="451">filterNanoAOD.py</text>
  <text class="small" x="390" y="474">Main student entry point</text>

  <rect class="main" x="710" y="320" rx="22" ry="22" width="220" height="120" filter="url(#shadow)"/>
  <text class="box-title" x="744" y="360">Filtered ROOT</text>
  <text class="box-text" x="749" y="392">selected events</text>
  <text class="box-text" x="731" y="418">engineered branches</text>

  <rect class="main" x="980" y="285" rx="24" ry="24" width="300" height="190" filter="url(#shadow)"/>
  <text class="box-title" x="1010" y="325">convert_h5/</text>
  <text class="box-text" x="1010" y="360">execute_convert_root2h5.py</text>
  <text class="box-text" x="1010" y="388">run_conversion.sh</text>
  <text class="box-text" x="1010" y="416">utilities/root.py</text>
  <text class="small" x="1010" y="463">ROOT -&gt; HDF5 conversion</text>

  <rect class="main" x="355" y="595" rx="22" ry="22" width="240" height="112" filter="url(#shadow)"/>
  <text class="box-title" x="403" y="635">HDF5 Datasets</text>
  <text class="box-text" x="401" y="667">features + labels</text>
  <text class="box-text" x="392" y="693">ML-ready inputs</text>

  <rect class="main" x="675" y="555" rx="24" ry="24" width="340" height="190" filter="url(#shadow)"/>
  <text class="box-title" x="705" y="595">ml_training/</text>
  <text class="box-text" x="705" y="630">execute_ml_training.py</text>
  <text class="box-text" x="705" y="658">models/models.py</text>
  <text class="box-text" x="705" y="686">src/optimize_model.py</text>
  <text class="box-text" x="705" y="714">src/test_results.py</text>

  <rect class="main" x="1095" y="595" rx="22" ry="22" width="230" height="112" filter="url(#shadow)"/>
  <text class="box-title" x="1144" y="635">Outputs</text>
  <text class="box-text" x="1120" y="667">model, ONNX, ROC,</text>
  <text class="box-text" x="1130" y="693">confusion matrix</text>

  <path class="line" marker-end="url(#arrow)" d="M 310 380 L 360 380"/>
  <path class="line" marker-end="url(#arrow)" d="M 660 380 L 710 380"/>
  <path class="line" marker-end="url(#arrow)" d="M 930 380 L 980 380"/>
  <path class="line" marker-end="url(#arrow)" d="M 1130 475 L 1130 532 L 845 532 L 845 555"/>
  <path class="line" marker-end="url(#arrow)" d="M 675 650 L 595 650"/>
  <path class="line" marker-end="url(#arrow)" d="M 1015 650 L 1095 650"/>

  <path class="line dashed" marker-end="url(#arrow)" d="M 820 320 L 820 150 L 1112 150 L 1112 128"/>
</svg>
